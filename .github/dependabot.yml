version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # Cargo.lock only, within the ranges Cargo.toml allows: the same updates the weekly
    # cargo update run tests. A 0.x minor bump (sqlx 0.8 to 0.9) is breaking in Cargo's
    # rules, so anything that needs Cargo.toml edited is upgraded by hand.
    versioning-strategy: lockfile-only
    groups:
      all-crates:
        patterns: ["*"]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
