version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      all-crates:
        patterns: ["*"]
    ignore:
      # Installs use the lockfile, so a major release reaches nobody until it is adopted
      # on purpose. Majors are upgraded by hand; this group carries minor and patch only.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
