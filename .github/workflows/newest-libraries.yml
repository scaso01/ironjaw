name: Newest libraries

# CI pins the toolchain (rust-toolchain.toml) and crates (Cargo.lock). This weekly run
# uses the newest stable Rust and crate versions instead, so a new lint or crate
# release that would break the build shows up within a week.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --component rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: cargo update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
